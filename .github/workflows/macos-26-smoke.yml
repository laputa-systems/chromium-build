name: macOS 26 native full build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-26-native-full-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      CHROMIUM_WORK_ROOT: /Volumes/dev/d/chromium-build/.work/macos-arm64
      MACOS_COMPILER_CACHE: off
      MACOS_MIN_FREE_GB: "80"
      MACOS_POST_FETCH_MIN_FREE_GB: "40"
      MACOS_REQUIRE_FULL_BUILD: "1"
      MACOS_REQUIRE_RUST_TOOLCHAIN: "1"
      MACOS_SKIP_ACCEPTANCE: "1"
      MACOS_INPUT_DOWNLOAD_WORKERS: "16"
      MACOS_INPUT_ENTRY_WORKERS: "4"
      RUSTUP_HOME: /Volumes/dev/d/chromium-build/.work/macos-arm64/tools/rustup
      CARGO_HOME: /Volumes/dev/d/chromium-build/.work/macos-arm64/cache/cargo
      HOMEBREW_CACHE: /Volumes/dev/d/chromium-build/.work/macos-arm64/cache/homebrew
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Clone into the policy work root
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Volumes/dev/d
          sudo chown "$(id -u):$(id -g)" /Volumes/dev /Volumes/dev/d
          git clone --depth=1 --no-tags --filter=blob:none \
            --branch "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            /Volumes/dev/d/chromium-build

      - name: Claim the policy work root
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_macos_ci.py claim-work-root \
            --repo-root /Volumes/dev/d/chromium-build \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64

      - name: Resolve locked input cache key
        id: input_cache_key
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          key="$(python3 scripts/verify_macos_ci.py cache-key --lock config/macos.inputs.lock)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore locked Chromium inputs
        id: restore_inputs
        uses: actions/cache/restore@v4
        with:
          path: /Volumes/dev/d/chromium-build/.work/macos-arm64/inputs
          key: ${{ steps.input_cache_key.outputs.key }}

      - name: Provision ephemeral LLVM and Rust prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          mkdir -p "$CHROMIUM_WORK_ROOT/tools/rustup" "$CARGO_HOME" "$HOMEBREW_CACHE"

          if ! command -v rustup >/dev/null 2>&1; then
            brew install rustup-init
            "$(brew --prefix rustup-init)/bin/rustup-init" -y --no-modify-path
          fi
          command -v rustup >/dev/null 2>&1
          rustup toolchain install nightly-2026-09-15 \
            --profile minimal \
            --component rust-src \
            --component llvm-tools-preview \
            --no-self-update
          rustup run nightly-2026-09-15 rustc --version --verbose

          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          llvm_formula=""
          for formula in llvm@23 llvm; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              llvm_formula="$formula"
              break
            fi
          done
          if [ -z "$llvm_formula" ]; then
            if brew info --formula llvm@23 >/dev/null 2>&1; then
              llvm_formula=llvm@23
            else
              llvm_formula=llvm
            fi
            brew install "$llvm_formula"
          fi

          llvm_root="$(brew --prefix "$llvm_formula")"
          if ! python3 scripts/verify_macos_ci.py verify-llvm \
            --clang "$llvm_root/bin/clang" \
            --minimum 23.1.0; then
            if [ "$llvm_formula" != llvm@23 ] && brew info --formula llvm@23 >/dev/null 2>&1; then
              llvm_formula=llvm@23
              brew install "$llvm_formula"
              llvm_root="$(brew --prefix "$llvm_formula")"
            else
              brew upgrade "$llvm_formula"
              llvm_root="$(brew --prefix "$llvm_formula")"
            fi
          fi
          "$llvm_root/bin/clang" --version
          LLVM_ROOT="$llvm_root"
          echo "LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$CARGO_HOME/bin:$LLVM_ROOT/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Run full-build host preflight
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          ./chromium-build --platform macos --arch arm64 --profile macos-release smoke-preflight
          python3 scripts/verify_macos_ci.py verify-preflight \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64 \
            --minimum-free-gb 80

      - name: Fetch locked Chromium inputs
        id: fetch_inputs
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          ./chromium-build --platform macos --arch arm64 --profile macos-release fetch

      - name: Cache locked Chromium inputs
        if: steps.fetch_inputs.outcome == 'success' && steps.restore_inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Volumes/dev/d/chromium-build/.work/macos-arm64/inputs
          key: ${{ steps.input_cache_key.outputs.key }}

      - name: Apply locked source preparation
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release prepare

      - name: Configure the native release graph
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release configure
          python3 scripts/verify_macos_ci.py verify-configure \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64

      - name: Confirm compiler caching is disabled
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release cache-stats
          python3 scripts/verify_macos_ci.py verify-cache-disabled \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64

      - name: Build Chromium for arm64
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          jobs="$(sysctl -n hw.ncpu)"
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          ./chromium-build --platform macos --arch arm64 --profile macos-release --jobs "$jobs" build

      - name: Sign and audit the finished app bundle
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release stage-runtime

      - name: Package the audited app bundle
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release package
          python3 scripts/verify_macos_ci.py verify-package \
            --work-root "$CHROMIUM_WORK_ROOT"
          version="$(python3 scripts/verify_macos_ci.py chromium-version --lock config/macos.inputs.lock)"
          release_root="$CHROMIUM_WORK_ROOT/release"
          archive="$release_root/Chromium-${version}-macos-arm64.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          ls -lh "$archive" "$archive.sha256"

      - name: Upload the prerelease asset
        working-directory: /Volumes/dev/d/chromium-build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_root="$CHROMIUM_WORK_ROOT/release"
          version="$(python3 scripts/verify_macos_ci.py chromium-version --lock config/macos.inputs.lock)"
          archive="$release_root/Chromium-${version}-macos-arm64.zip"
          tag="chromium-macos-${version}-run-${GITHUB_RUN_ID}"
          notes="$release_root/release-notes.md"
          cat > "$notes" <<EOF
          Unfinished CI validation prerelease for Chromium $version.

          - Architecture: arm64
          - Host: macOS 26+
          - Compiler cache: disabled
          - Shadowdriver acceptance: intentionally not run in remote CI
          - GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Commit: $GITHUB_SHA
          EOF
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Chromium $version macOS arm64 CI build" \
            --notes-file "$notes" \
            "$archive" \
            "$archive.sha256"
