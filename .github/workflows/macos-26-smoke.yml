name: macOS 26 native full build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-26-native-full-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      CHROMIUM_WORK_ROOT: /Volumes/dev/d/chromium-build/.work/macos-arm64
      MACOS_COMPILER_CACHE: off
      MACOS_MIN_FREE_GB: "80"
      MACOS_POST_FETCH_MIN_FREE_GB: "40"
      MACOS_REQUIRE_FULL_BUILD: "1"
      MACOS_REQUIRE_RUST_TOOLCHAIN: "1"
      MACOS_SKIP_ACCEPTANCE: "1"
      RUSTUP_HOME: /Volumes/dev/d/chromium-build/.work/macos-arm64/tools/rustup
      CARGO_HOME: /Volumes/dev/d/chromium-build/.work/macos-arm64/cache/cargo
      HOMEBREW_CACHE: /Volumes/dev/d/chromium-build/.work/macos-arm64/cache/homebrew
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Clone into the policy work root
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Volumes/dev/d
          sudo chown "$(id -u):$(id -g)" /Volumes/dev /Volumes/dev/d
          git clone --depth=1 --no-tags --filter=blob:none \
            --branch "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            /Volumes/dev/d/chromium-build

      - name: Claim the policy work root
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          import macos_backend

          repo = Path("/Volumes/dev/d/chromium-build").resolve()
          layout = macos_backend.WorkLayout(
              Path("/Volumes/dev/d/chromium-build/.work/macos-arm64"),
              repo,
          )
          layout.ensure()
          print(layout.root)
          PY

      - name: Provision ephemeral LLVM and Rust prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          mkdir -p "$CHROMIUM_WORK_ROOT/tools/rustup" "$CARGO_HOME" "$HOMEBREW_CACHE"

          if ! command -v rustup >/dev/null 2>&1; then
            brew install rustup-init
            "$(brew --prefix rustup-init)/bin/rustup-init" -y --no-modify-path
          fi
          command -v rustup >/dev/null 2>&1
          rustup toolchain install nightly-2026-09-15 \
            --profile minimal \
            --component rust-src \
            --component llvm-tools-preview \
            --no-self-update
          rustup run nightly-2026-09-15 rustc --version --verbose

          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          llvm_formula=""
          for formula in llvm@23 llvm; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              llvm_formula="$formula"
              break
            fi
          done
          if [ -z "$llvm_formula" ]; then
            if brew info --formula llvm@23 >/dev/null 2>&1; then
              llvm_formula=llvm@23
            else
              llvm_formula=llvm
            fi
            brew install "$llvm_formula"
          fi

          llvm_root="$(brew --prefix "$llvm_formula")"
          if ! python3 -c 'import re, sys; text=sys.stdin.read(); match=re.search(r"version (\d+)\.(\d+)(?:\.(\d+))?", text); sys.exit(0 if match and tuple(int(match.group(i) or 0) for i in range(1, 4)) >= (23, 1, 0) else 1)' < <("$llvm_root/bin/clang" --version); then
            if [ "$llvm_formula" != llvm@23 ] && brew info --formula llvm@23 >/dev/null 2>&1; then
              llvm_formula=llvm@23
              brew install "$llvm_formula"
              llvm_root="$(brew --prefix "$llvm_formula")"
            else
              brew upgrade "$llvm_formula"
              llvm_root="$(brew --prefix "$llvm_formula")"
            fi
          fi
          "$llvm_root/bin/clang" --version
          LLVM_ROOT="$llvm_root"
          echo "LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$CARGO_HOME/bin:$LLVM_ROOT/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Run full-build host preflight
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          ./chromium-build --platform macos --arch arm64 --profile macos-release smoke-preflight
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/Volumes/dev/d/chromium-build/.work/macos-arm64/metadata/doctor.json")
              .read_text(encoding="utf-8")
          )
          assert report["status"] == "complete", report
          assert report["preflight_scope"] == "host-only-full-build", report
          macos_version = tuple(int(part) for part in report["checks"]["macos"]["version"].split("."))
          sdk_version = tuple(int(part) for part in report["checks"]["xcode"]["sdk_version"].split("."))
          llvm_version = tuple(int(part) for part in report["checks"]["llvm"]["version"].split("."))
          assert macos_version >= (26, 0, 0), report
          assert sdk_version >= (26, 0, 0), report
          assert llvm_version >= (23, 1, 0), report
          assert report["checks"]["rust"]["status"] == "complete", report
          assert report["checks"]["rust"]["toolchain"] == "nightly-2026-09-15", report
          assert report["checks"]["rust"]["components"] == ["rust-src", "llvm-tools-preview"], report
          assert report["checks"]["compiler_cache"]["status"] == "disabled", report
          assert report["checks"]["filesystem"]["minimum_free_bytes"] >= 80 * 1024**3, report
          for tool in ("llvm-ar", "llvm-nm", "llvm-objcopy", "llvm-strip"):
              assert tool in report["checks"]["llvm"]["tools"], report
          assert all(item["status"] == "skipped" for item in report["references"].values()), report
          PY

      - name: Fetch locked Chromium inputs
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          ./chromium-build --platform macos --arch arm64 --profile macos-release fetch

      - name: Apply locked source preparation
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release prepare

      - name: Configure the native release graph
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release configure
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("/Volumes/dev/d/chromium-build/.work/macos-arm64")
          report = json.loads((root / "metadata" / "configure-macos.json").read_text(encoding="utf-8"))
          assert report["status"] == "complete", report
          args = (root / "metadata" / "macos-release.args.gn").read_text(encoding="utf-8")
          assert 'macos_single_locale = "en-US"' in args, args
          assert "is_component_build = false" in args, args
          PY

      - name: Confirm compiler caching is disabled
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release cache-stats
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/Volumes/dev/d/chromium-build/.work/macos-arm64/metadata/compiler-cache-stats.json")
              .read_text(encoding="utf-8")
          )
          assert report["cache"]["status"] == "disabled", report
          PY

      - name: Build Chromium for arm64
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          jobs="$(sysctl -n hw.ncpu)"
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          ./chromium-build --platform macos --arch arm64 --profile macos-release --jobs "$jobs" build

      - name: Sign and audit the finished app bundle
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release stage-runtime

      - name: Package the audited app bundle
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          release_root="$CHROMIUM_WORK_ROOT/release"
          mkdir -p "$release_root"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo = Path("/Volumes/dev/d/chromium-build").resolve()
          root = Path(os.environ["CHROMIUM_WORK_ROOT"]).resolve()
          candidate = json.loads((root / "stage" / "candidate.json").read_text(encoding="utf-8"))
          if candidate.get("status") != "complete":
              raise SystemExit(f"candidate is not complete: {candidate}")
          app = Path(candidate["app"]).resolve()
          candidates_root = (root / "stage" / "candidates").resolve()
          if candidates_root not in app.parents or app.name != "Chromium.app":
              raise SystemExit(f"candidate escapes the owned candidate root: {app}")
          if not (app / "Contents" / "MacOS" / "Chromium").is_file():
              raise SystemExit(f"candidate executable is missing: {app}")
          version = json.loads((repo / "config" / "macos.inputs.lock").read_text(encoding="utf-8"))["chromium"]["version"]
          release = root / "release"
          (release / "candidate-app-path").write_text(str(app) + "\n", encoding="utf-8")
          (release / "version").write_text(version + "\n", encoding="utf-8")
          (release / "build-manifest.json").write_text(
              json.dumps(
                  {
                      "status": "complete",
                      "version": version,
                      "architecture": "arm64",
                      "app": str(app),
                      "fingerprint": candidate["fingerprint"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "commit": os.environ["GITHUB_SHA"],
                      "acceptance": "not-run-in-remote-ci",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          app_path="$(cat "$release_root/candidate-app-path")"
          version="$(cat "$release_root/version")"
          archive="$release_root/Chromium-${version}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          test -s "$archive"
          test -s "$archive.sha256"
          ls -lh "$archive" "$archive.sha256" "$release_root/build-manifest.json"

      - name: Upload the prerelease asset
        working-directory: /Volumes/dev/d/chromium-build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_root="$CHROMIUM_WORK_ROOT/release"
          version="$(cat "$release_root/version")"
          archive="$release_root/Chromium-${version}-macos-arm64.zip"
          tag="chromium-macos-${version}-run-${GITHUB_RUN_ID}"
          notes="$release_root/release-notes.md"
          cat > "$notes" <<EOF
          Unfinished CI validation prerelease for Chromium $version.

          - Architecture: arm64
          - Host: macOS 26+
          - Compiler cache: disabled
          - Shadowdriver acceptance: intentionally not run in remote CI
          - GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Commit: $GITHUB_SHA
          EOF
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Chromium $version macOS arm64 CI build" \
            --notes-file "$notes" \
            "$archive" \
            "$archive.sha256" \
            "$release_root/build-manifest.json"
