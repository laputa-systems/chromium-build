name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.ref.outputs.default_branch }}
    steps:
      - name: Require the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" ]]; then
            echo "Release dispatch rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

  build:
    name: Build (aarch64-apple-darwin)
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      CHROMIUM_WORK_ROOT: /Volumes/dev/d/chromium-build/.work/macos-arm64
      MACOS_COMPILER_CACHE: off
      MACOS_MIN_FREE_GB: "80"
      MACOS_POST_FETCH_MIN_FREE_GB: "40"
      MACOS_REQUIRE_FULL_BUILD: "1"
      MACOS_REQUIRE_RUST_TOOLCHAIN: "1"
      MACOS_SKIP_ACCEPTANCE: "1"
      MACOS_INPUT_DOWNLOAD_WORKERS: "16"
      MACOS_INPUT_ENTRY_WORKERS: "4"
      RUSTUP_HOME: /Volumes/dev/d/chromium-build/.work/macos-arm64/tools/rustup
      CARGO_HOME: /Volumes/dev/d/chromium-build/.work/macos-arm64/cache/cargo

    steps:
      - name: Clone the exact dispatched commit
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Volumes/dev/d
          sudo chown "$(id -u):$(id -g)" /Volumes/dev /Volumes/dev/d
          git clone --no-checkout --depth=1 --no-tags --filter=blob:none \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            /Volumes/dev/d/chromium-build
          git -C /Volumes/dev/d/chromium-build fetch --depth=1 origin "$GITHUB_SHA"
          git -C /Volumes/dev/d/chromium-build checkout "$GITHUB_SHA"
          test "$(git -C /Volumes/dev/d/chromium-build rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Claim the policy work root
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_macos_ci.py claim-work-root \
            --repo-root /Volumes/dev/d/chromium-build \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64

      - name: Resolve locked input cache key
        id: input_cache_key
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          key="$(python3 scripts/verify_macos_ci.py cache-key --lock config/macos.inputs.lock)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore locked Chromium inputs
        id: restore_inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Volumes/dev/d/chromium-build/.work/macos-arm64/inputs
          key: ${{ steps.input_cache_key.outputs.key }}

      - name: Fetch locked Chromium inputs
        id: fetch_inputs
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          ./chromium-build --platform macos --arch arm64 --profile macos-release fetch

      - name: Run full-build host preflight
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          ./chromium-build --platform macos --arch arm64 --profile macos-release smoke-preflight
          python3 scripts/verify_macos_ci.py verify-preflight \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64 \
            --minimum-free-gb 80

      - name: Cache locked Chromium inputs
        if: steps.fetch_inputs.outcome == 'success' && steps.restore_inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Volumes/dev/d/chromium-build/.work/macos-arm64/inputs
          key: ${{ steps.input_cache_key.outputs.key }}

      - name: Apply locked source preparation
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release prepare

      - name: Configure the native release graph
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release configure
          python3 scripts/verify_macos_ci.py verify-configure \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64

      - name: Confirm compiler caching is disabled
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release cache-stats
          python3 scripts/verify_macos_ci.py verify-cache-disabled \
            --work-root /Volumes/dev/d/chromium-build/.work/macos-arm64

      - name: Build Chromium for arm64
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DIR SCCACHE_DIR RBE_service GOMA_service RECLIENT_service SISO_service || true
          jobs="$(sysctl -n hw.ncpu)"
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          ./chromium-build --platform macos --arch arm64 --profile macos-release --jobs "$jobs" build

      - name: Sign and audit the finished app bundle
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release stage-runtime

      - name: Package the audited app bundle
        id: package
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        run: |
          set -euo pipefail
          ./chromium-build --platform macos --arch arm64 --profile macos-release package
          python3 scripts/verify_macos_ci.py verify-package \
            --work-root "$CHROMIUM_WORK_ROOT"
          version="$(python3 scripts/verify_macos_ci.py chromium-version --lock config/macos.inputs.lock)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7

      - name: Assemble the release archive
        working-directory: /Volumes/dev/d/chromium-build
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/release-venv
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python scripts/release_assets.py macos \
            --work-root "$CHROMIUM_WORK_ROOT" \
            --output "$RUNNER_TEMP/release-assets" \
            --source-revision "$GITHUB_SHA"
          ls -lh "$RUNNER_TEMP/release-assets"

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-aarch64-apple-darwin
          path: |
            ${{ runner.temp }}/release-assets/chromium-*-aarch64-apple-darwin.tar.xz
            ${{ runner.temp }}/release-assets/chromium-*-aarch64-apple-darwin.manifest.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create pre-release
    needs: [preflight, build]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recheck release ref and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          else
            if [[ "$response" != *"HTTP 404"* ]]; then
              printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
              exit 1
            fi
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chromium-aarch64-apple-darwin
          path: dist

      - name: Verify release assets and write checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          export LC_ALL=C
          archive="chromium-$VERSION-aarch64-apple-darwin.tar.xz"
          manifest="chromium-$VERSION-aarch64-apple-darwin.manifest.json"
          expected=$(printf '%s\n' "$archive" "$manifest")
          actual=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release assets:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          test -s "dist/$archive"
          jq -e --arg version "$VERSION" --arg sha "$GITHUB_SHA" \
            '.schema_version == 1 and .product == "chromium" and .version == $version and .target == "aarch64-apple-darwin" and .source_revision == $sha and (.sources_lock_sha256 | test("^[0-9a-f]{64}$"))' \
            "dist/$manifest" >/dev/null
          cd dist
          sha256sum -- "$archive" "$manifest" | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create release tag at triggering SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: release-${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "Created $RELEASE_TAG at $GITHUB_SHA"
          else
            printf 'Could not create release tag %s at %s: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" "$response" >&2
            exit 1
          fi

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$previous" ]]; then
            printf 'Initial release at %s.\n' "$GITHUB_SHA" > "$notes"
            exit 0
          fi
          compare="repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA"
          status=$(gh api "$compare" --jq '.status')
          if [[ "$status" != ahead ]]; then
            printf 'Release notes rejected: %s is %s relative to %s, expected ahead\n' "$GITHUB_SHA" "$status" "$previous" >&2
            exit 1
          fi
          {
            printf '## Changes since %s\n\n' "$previous"
            gh api --paginate "$compare?per_page=100" --jq '.commits[] | "- \(.sha[0:12]) \(.commit.message | split("\n")[0])"'
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_SHA"
          } > "$notes"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          assets=(dist/chromium-*-aarch64-apple-darwin.tar.xz dist/chromium-*-aarch64-apple-darwin.manifest.json dist/SHA256SUMS)
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" --title "$RELEASE_TAG" "${assets[@]}"
