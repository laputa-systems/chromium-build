[project]
name = "chromium-build"
version = "0.1.0"
description = "Chromium build orchestration"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "ty==0.0.91",
    "uv==0.13.5",
]

[tool.ruff]
target-version = "py315"

[tool.ty.environment]
root = ["scripts", "tests"]
python-version = "3.15"
