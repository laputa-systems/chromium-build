[project]
name = "chromium-build"
version = "0.1.0"
description = "Chromium build orchestration"
requires-python = ">=3.15"
dependencies = ["laputa-buildlib==0.1.0"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = false

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.101",
    "uv==0.13.7",
]

[tool.ruff]
target-version = "py315"

[tool.ty.environment]
root = ["scripts", "tests"]
python-version = "3.15"
python-platform = "all"

[tool.ty.analysis]
allowed-unresolved-imports = ["PIL", "PIL.*", "gclient_eval"]

[[tool.uv.index]]
url = "https://pypi.17166969.xyz/current/simple/"
default = true
